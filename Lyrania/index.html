<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrania - Accueil</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/img/lyrania.png">
    <script src="https://kit.fontawesome.com/3134cfd3e0.js" crossorigin="anonymous"></script>
</head>
<body>

    <header id="header">

        <div id="banner">

            <nav id="nav">

                <span class="utils">
    
                    <a href="#">Accueil</a>
                    <a href="#">Shop</a>
                    <a href="#">Forum</a>
                    <a href="#">Stats</a>
    
                </span>
    
                <span class="icons">
    
                    <a href="#"><i class="fas fa-user"></i></a>
                    <a href="#"><i class="fas fa-bars"></i></a>
    
                </span>
    
            </nav>

        </div>

        <div id="content">

            <img src="assets/img/lyrania.png" alt="Logo du site web">

            <div class="flexbox">

                <span class="stats">

                    <span class="minecraft">

                        <p>
                            +100 joueurs connectés
                        </p>
    
                        <p class="ip">play.lyrania.fr</p>
    
                    </span>
    
    
                    <span class="discord">
    
                        <i class="fab fa-discord"></i>
    
                        <p>+600 membres<br>rejoindre le discord</p>
    
                    </span>

                </span>

            </div>

        </div>

    </header>

    <span id="ip">

        <p>play.lyrania.fr</p>

    </span>

    <div id="landing-page">

        <img src="assets/img/background.png" alt="Image du serveur">
        <img src="assets/img/background.png" alt="Image du serveur">

    </div>

    <footer id="footer"></footer>

    <a href="#footer" class="go-down"><i class="fas fa-long-arrow-alt-down"></i></a>

    <script src="assets/js/index.js"></script>
    
</body>
</html>
